<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conectum — Iniciar Sesión</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="styles.css" /> 
    <link rel="stylesheet" href="login.css" /> 
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="conectum_logo.png" alt="Conectum" class="login-logo">
            <h2>Iniciar Sesión</h2>
            <p>Accede a tu cuenta de Conectum</p>

            <form class="login-form" id="loginForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="button" class="btn login-btn" onclick="iniciarSesion()">Iniciar Sesión</button>
            </form>

            <div class="separator">
                <span>o</span>
            </div>

            <a href="register.html" class="btn create-account-btn">Crear Cuenta Nueva</a>

            <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>
    </div>

    <script>
        function iniciarSesion() {
            window.location.href = 'index.html'; 
        }
    </script>
</body>
</html>
