<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectum — Perfil de usuario</title>
    
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="perfil.css" />

</head>
<body>
      <div class="app">
            <!-- barra lateral -->
        <aside class="sidebar" aria-label="Barra Lateral">
            <div class="sidebar-inner">
                <button class="sb-btn" title="Post">
                    <i class="fa-solid fa-pen"></i>
                    <span>Post</span>  
                </button>
                <button class="sb-btn active" title="Jobs">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Jobs</span>
                    <span class="badge">8</span>
                </button>
                <button class="sb-btn" title="People">
                    <i class="fa-solid fa-user-group"></i>
                    <span>People</span>
                    <span class="badge">8</span>
                </button>
                <button class="sb-btn" title="Chat">
                    <i class="fa-regular fa-message"></i>
                    <span>Chat</span>
                </button>
                <button class="sb-btn" title="Alerts">
                    <i class="fa-regular fa-bell"></i>
                    <span>Alerts</span>
                </button>
                <button class="sb-btn" title="Profile">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </button>
            </div>
        </aside>

        <main class="main" role="main">
            <header class="topbar">
                <div class="top-left">
                    <img src="conectum_logo.png" alt="Conectum" class="logo">
                </div>
                <div class="top-center">
                    <div class="search search-main" role="search" ariabel="Buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" placeholder="Search"/>
                    </div>
                </div>
                <div class="top-right">
                    <button class="icon-btn" title="Configuración"><i class="fa-solid fa-gear"></i></button>
                </div>
            </header>

                <!-- Mi parte -->
            <section class="page">
                <div class="profile-grid">

                    <aside class="profile-left">
                        <div class="box section">
                            
                            <!-- Contenido Estudios-->
                            
                            <div class="section-header">
                                <h3>Estudios</h3>
                            </div>

                            <div class="section-content">

                                <div class="item">
                                    <div class="avatar"></div>
                                    <div class="item-main">
                                        <strong>Universidad Rafael Landivar</strong>
                                        <span class="item-sub">Ingeniería en Sistemas</span>
                                        <span class="item-meta">2022-Actualidad</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="box">Contactos</div>    
                    </aside>

                    <section class="profile-center">
                        <div class="box">Perfil principal</div>
                        <div class="box">Premios</div>
                        <div class="box">Certificaciones</div>
                    </section>
                    
                    <aside class="profile-right">
                        <div class="box">Experiencias</div>
                        <div class="box">Intereses</div>
                    </aside>

                </div>
            </section>
        </main>
      </div>

</body>
</html>
