<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conectum - Perfil de usuario</title>
    
  <!-- Fuentes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="perfil.css" />

</head>
<body>
      <div class="app">
            <!-- barra lateral -->
        <aside class="sidebar" aria-label="Barra Lateral">
            <div class="sidebar-inner">
                <button class="sb-btn" title="Post">
                    <i class="fa-solid fa-pen"></i>
                    <span>Post</span>  
                </button>
                <button class="sb-btn active" title="Jobs">
                    <i class="fa-solid fa-briefcase"></i>
                    <span>Jobs</span>
                    <span class="badge">8</span>
                </button>
                <button class="sb-btn" title="People">
                    <i class="fa-solid fa-user-group"></i>
                    <span>People</span>
                    <span class="badge">8</span>
                </button>
                <button class="sb-btn" title="Chat">
                    <i class="fa-regular fa-message"></i>
                    <span>Chat</span>
                </button>
                <button class="sb-btn" title="Alerts">
                    <i class="fa-regular fa-bell"></i>
                    <span>Alerts</span>
                </button>
                <button class="sb-btn" title="Profile">
                    <i class="fa-solid fa-user"></i>
                    <span>Profile</span>
                </button>
            </div>
        </aside>

        <main class="main" role="main">
            <header class="topbar">
                <div class="top-left">
                    <img src="conectum_logo.png" alt="Conectum" class="logo">
                </div>
                <div class="top-center">
                    <div class="search search-main" role="search" aria-label="Buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="search" placeholder="Search"/>
                    </div>
                </div>
                <div class="top-right">
                    <button class="icon-btn" title="Configuración"><i class="fa-solid fa-gear"></i></button>
                </div>
            </header>



             <!--Codigo modificado-->
            <section class="page">
                <!--Contenido Perfil-->
                <div class="profile-grid">
                    
                 <!-- Box principal ocupa toda la fila -->
                         <div class="box box-mainperfil">
                             <h2>Perfil principal</h2>
                         </div>

                        <div class="col left">
                             <div class="box box-studies">
                                <h2>Estudios</h2>
                                 <div class="academic-content">
                                     <div class="avatar"></div>
                                      <div class="academic-info">
                                         <strong>Universidad Rafael Landivar</strong>
                                         <span class="item-sub">Ingeniería en Sistemas</span>
                                         <span class="item-meta">2022-Actualidad</span>
                                       </div>
                                 </div>
                             </div>
                            
                             <div class="box box-contacts">
                                <h2>Contactos</h2>
                             </div>

                             <div class="box box-interests">
                                <h2>Intereses</h2>
                             </div>
                      </div>

                      <!-- Columna central -->
                       <div class="col center">
                             <div class="box box-experiences">
                                <h2>Experiencias</h2>
                             </div>
                             <div class="box box-post">
                                <h2>post</h2>
                             </div>
                       </div>

                        <div class="col right">
                             <div class="box box-certifications">
                                <h2>Certificaciones</h2> 
                             </div>
                             <div class="box box-volunteering">
                                <h2>Voluntariado</h2>
                             </div>

                             <div class="box box-skills">
                                <h2>Aptitudes</h2>
                                
                             </div>
                        </div>
                </div>
            </section>
        </main>
      </div>

</body>
</html>
