<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Conectum — Crear Cuenta</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <link rel="stylesheet" href="styles.css" /> 
    <link rel="stylesheet" href="login.css" /> 
    <link rel="stylesheet" href="register.css" /> 
</head>
<body>
    <div class="login-container">
        <div class="login-box register-box">
            <img src="conectum_logo.png" alt="Conectum" class="login-logo">
            <h2>Crea tu Cuenta</h2>
            <p>Únete a la red de Conectum para encontrar tu próximo empleo</p>

            <form class="login-form">
                <div class="input-row">
                    <div class="input-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" placeholder="Juan" required>
                    </div>
                    <div class="input-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" placeholder="Pérez" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="tu@ejemplo.com" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                
                <div class="input-group">
                    <label for="profesion">Profesión</label>
                    <input type="text" id="profesion" placeholder="Diseñador Web, Desarrollador, etc." required>
                </div>

                <div class="input-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" placeholder="Ciudad de Guatemala, San Salvador, etc." required>
                </div>
                
                <button type="button" class="btn login-btn">Crear Cuenta</button>
            </form>

            <div class="separator">
                <span>o</span>
            </div>

            <a href="login.html" class="forgot-password">¿Ya tienes cuenta? Inicia Sesión</a>
        </div>
    </div>
</body>
</html>
